name: HMPM-ECOS-Automation-Framework

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev

      shop:
        description: "Select the shop context"
        required: true
        default: "cookiedent"
        type: choice
        options:
          - cookiedent
          - twix

      test_suite:
        description: "Select the test suite execution scope"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - api
          - ui

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-automation:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./TAF-ECOSS

    steps:

      # -----------------------------
      # Checkout Repository
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Setup Java
      # -----------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # -----------------------------
      # Install Playwright Browsers
      # -----------------------------
      - name: Install Playwright Browsers
        run: |
          mvn exec:java -e \
          -Dexec.mainClass=com.microsoft.playwright.CLI \
          -Dexec.args="install --with-deps"

      # -----------------------------
      # Execute Tests
      # -----------------------------
      - name: Run Tests with Maven
        run: |
          TARGET_URL="https://${{ github.event.inputs.shop }}.${{ github.event.inputs.environment }}k8s.hm-pm.net"

          SUITE_SELECTION="${{ github.event.inputs.test_suite }}"

          if [ "$SUITE_SELECTION" = "api" ]; then
            SUITE_FLAG="-DsuiteXmlFile=src/test/resources/suites/api/sprint_two/general_api_test.xml"
          elif [ "$SUITE_SELECTION" = "ui" ]; then
            SUITE_FLAG="-DsuiteXmlFile=src/test/resources/suites/ui/sprint_two/cart-tests.xml"
          else
            SUITE_FLAG=""
          fi

          mvn clean test $SUITE_FLAG -DbaseUrl=$TARGET_URL

      # -----------------------------
      # Debug Allure Results
      # -----------------------------
      - name: Debug Allure Results
        if: always()
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Allure results:"
          ls -R allure-results || true

      # -----------------------------
      # Install Allure CLI
      # -----------------------------
      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      # -----------------------------
      # Verify Allure Results
      # -----------------------------
      - name: Verify Allure Results Exist
        if: always()
        run: |
          if [ ! -d "allure-results" ]; then
            echo "ERROR: allure-results directory not found"
            exit 1
          fi

          RESULT_COUNT=$(find allure-results -name "*-result.json" | wc -l)

          echo "Result files count: $RESULT_COUNT"

          if [ "$RESULT_COUNT" -eq 0 ]; then
            echo "ERROR: No Allure result files found"
            exit 1
          fi

      # -----------------------------
      # Generate Allure Report
      # -----------------------------
      - name: Generate Allure Report
        if: always()
        run: |
          REPORT_DIR="allure-report"

          echo "REPORT_DIR=$REPORT_DIR" >> $GITHUB_ENV

          allure generate allure-results --clean -o $REPORT_DIR

          echo "Generated report:"
          ls -R $REPORT_DIR

      # -----------------------------
      # Deploy Report to GitHub Pages
      # -----------------------------
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./TAF-ECOSS/allure-report
          force_orphan: true

      # -----------------------------
      # Upload Artifact
      # -----------------------------
      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./TAF-ECOSS/allure-report

      # -----------------------------
      # Print Report URL
      # -----------------------------
      - name: Print Report URL
        if: always()
        run: |
          echo "Allure Report URL:"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"